[package]
name = "actionoscope"
version = "0.2.0"
edition = "2021"
authors = ["Diogo Aurelio diogo@mklabs.io"]
description = "Actionoscope is a CLI tool to run steps from a GitHub Actions workflow locally."
license = "MIT"
repository = "https://github.com/diogoaurelio/actionoscope"
readme = "README.md"
keywords = ["github-actions", "rust", "devops", "ci", "cd"]

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4.5.26", features = ["derive"] }
env_logger = "0.11.6"
regex = "1.11.1"
dotenv = "0.15.0"
git2 = "0.20.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1.3"
ctor = "0.2.9"

[[bin]]
name = "actionoscope"
path = "actionoscope-cli/src/main.rs"

[workspace]
members = [
    "actionoscope-cli",
]

[lib]
name = "actionoscope"
path = "src/lib.rs"
